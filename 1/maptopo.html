<!DOCTYPE html>
<html style="height: 100%;">

<head>
	<title>Hornussen: Gesellschaften</title>
	<style>
	    /* <![CDATA[ */
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
		}
		/*]]>*/
	</style>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.8.0/dist/leaflet.css"/>
	<script src="https://cdn.jsdelivr.net/npm/leaflet@1.8.0/dist/leaflet.js"></script>
	<script src="https://hgverwaltung.ch/polyfill/v3/polyfill.min.js?features=fetch,String.prototype.startsWith"></script>
	<script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.js"></script>
</head>

<body style="height: 100%;">

	<select id="ligaSelection">
		<option value="alle">Alle</option>
	</select>
	<input id="nameFilterInput" type="text" placeholder="Name" width="100">

	<div id="mapid" style="margin-top:10px; height: 100%;"></div>

	<script>
		var map;
		var locations = [];
		var index;
		var markerGroup;
		// API-Liga/Gruppe (z.B. "A"/1, "B"/2, "3"/4) -> Code der Locations-API (nla, nlb2, 3l4)
		function ligaCode(liga, gruppe) {
			liga = String(liga).toUpperCase();
			if (liga === 'A') {
				return 'nla';
			}
			if (liga === 'B') {
				return 'nlb' + gruppe;
			}
			return liga + 'l' + gruppe;
		}

		function ligaLabel(liga) {
			liga = String(liga).toUpperCase();
			return liga === 'A' || liga === 'B' ? 'NL' + liga : liga + '. Liga';
		}

		function loadLigen() {
			var select = document.getElementById('ligaSelection');
			return fetch('https://hgverwaltung.ch/api/1/live/meisterschaft/liga')
				.then(function (response) {
					return response.json();
				}).then(function (data) {
					var groups = {};
					var order = [];
					data.forEach(function (item) {
						if (!groups[item.liga]) {
							groups[item.liga] = [];
							order.push(item.liga);
						}
						groups[item.liga].push(item.gruppe);
					});
					order.forEach(function (liga) {
						var gruppen = groups[liga];
						var parent = select;
						if (gruppen.length > 1) {
							parent = document.createElement('optgroup');
							parent.label = ligaLabel(liga);
							select.appendChild(parent);
						}
						gruppen.forEach(function (gruppe) {
							var option = document.createElement('option');
							option.value = ligaCode(liga, gruppe);
							option.textContent = gruppen.length > 1 ? 'Gruppe ' + gruppe : ligaLabel(liga);
							parent.appendChild(option);
						});
					});
				}).catch(function (error) {
					console.error('Fehler beim Laden der Ligen:', error);
				});
		}
		function initialize() {
			map = new L.Map('mapid', {
			crs: L.CRS.EPSG3857,
			continuousWorld: true,
			worldCopyJump: false
			});
			var url = 'https://wmts20.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg';
			var tilelayer = new L.tileLayer(url);
			map.addLayer(tilelayer);
			map.setView(L.latLng(46.938261,8.2765473), 9);

			loadLigen();

			var ligaSelection = document.getElementById('ligaSelection');
			ligaSelection.addEventListener('change', onLigaChange);

			var nameFilterInput = document.getElementById('nameFilterInput');
			nameFilterInput.addEventListener('keyup', onNameFilterInputChange);

			getLocations('alle').then(function (data) {
				index = lunr(function () {
					this.ref('id');
					this.field('ort');
					this.field('name');

					var i = 0;
					for (; i < data.length; i++) {
						locations[i] = data[i];
						data[i].id = i;
						this.add(data[i]);
					}
				});
			});
		}
		function onLigaChange(e) {
			document.getElementById('nameFilterInput').value = '';
			getLocations(e.target.value);
		}
		function debounce(func, interval) {
			var lastCall = -1;
			return function () {
				clearTimeout(lastCall);
				var args = arguments;
				var self = this;
				lastCall = setTimeout(function () {
					func.apply(self, args);
				}, interval);
			};
		}
		function onNameFilterInputChange(e) {
			document.getElementById('ligaSelection').value = 'alle';
			debounce(function () {
				if (!e.target.value) {
					showData(locations);
				}
				else {
					var matches = index.search(e.target.value + '*');
					var data = matches.map(function (r) {
						return locations[r.ref];
					});
					showData(data);
				}
			}, 200)();
		}
		function getLocations(liga) {
			var clubs = liga === 'alle';
			return fetch("https://www.hgverwaltung.ch/api/1/clubs/locations/" + liga + "?clubs="+clubs)
				.then(function (response) {
					return response.json();
				}).then(function (results) {
					showData(results);
					return results;
				});
		}
		function showData(data) {
			if (markerGroup) {
				markerGroup.removeFrom(map);
			}
			markerGroup = L.layerGroup(null).addTo(map);

			var positions = [];
			for (var i = 0; i < data.length; i++) {
				var info = '';
				var hp = data[i].homepage;
				if (hp) {
					if (!hp.startsWith('http')) {
						hp = 'http://' + hp;
					}
					info = '<a href="' + hp + '" target="_blank"><h3>' + data[i].name + '</h3></a>'
				} else {
					info = '<h3>' + data[i].name + '</h3>';
				}
				info += '<p>';
				info += '<a href="https://maps.google.com?daddr=' + data[i].lat + ',' + data[i].lng + '" target="_blank">Google Routenplaner</a>';
				info += '</p>';
				L.marker([data[i].lat, data[i].lng]).bindPopup(info).addTo(markerGroup);
				positions.push([data[i].lat, data[i].lng]);
			}
		}

		initialize();
	</script>

</body>

</html>
